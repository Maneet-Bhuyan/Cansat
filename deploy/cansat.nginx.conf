# ==============================================================================
# Cognitive CanSat - Production Nginx Reverse Proxy Configuration
# ==============================================================================
# Place in: /etc/nginx/sites-available/cansat
# Symlink to: /etc/nginx/sites-enabled/cansat
# Test: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com; # Replace with your Hostinger domain or VPS IP

    # Redirect all HTTP traffic to HTTPS (Certbot will manage this automatically)
    # return 301 https://$host$request_uri;

    client_max_body_size 64M;

    # Gzip Compression for Fast Remote Loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Root location: Proxy everything to FastAPI application (port 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Persistent WebSockets (Serial Bridge & Telemetry Stream)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static Assets Direct Caching (CSS, JS, Images, Test Videos)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webm|mp4|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
